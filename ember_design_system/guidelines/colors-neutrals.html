<!-- @dsCard group="Colors" viewport="700x168" name="Core neutrals" subtitle="Warm ink + cream — the only background pair" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:#cdc3b0;font-family:var(--font-mono);} .row{display:flex;gap:12px;} .sw{flex:1;min-width:0;} .blk{height:74px;border-radius:10px;border:1px solid rgba(0,0,0,.12);} .nm{margin-top:8px;font:600 12.5px var(--font-mono);color:#1c1812;} .hx{font:400 11.5px var(--font-mono);color:#5c5446;}</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="blk" style="background:var(--ink);"></div><div class="nm">ink</div><div class="hx">#16130e</div></div>
    <div class="sw"><div class="blk" style="background:var(--ink-2);"></div><div class="nm">ink-2</div><div class="hx">#1c1812</div></div>
    <div class="sw"><div class="blk" style="background:var(--ink-3);"></div><div class="nm">ink-3</div><div class="hx">#0e0c08</div></div>
    <div class="sw"><div class="blk" style="background:var(--paper);"></div><div class="nm">paper</div><div class="hx">#f4efe6</div></div>
    <div class="sw"><div class="blk" style="background:var(--paper-2);"></div><div class="nm">paper-2</div><div class="hx">#efe7d8</div></div>
    <div class="sw"><div class="blk" style="background:var(--paper-3);"></div><div class="nm">paper-3</div><div class="hx">#e3d9c6</div></div>
  </div>
</body>
</html>

<!-- @dsCard group="Spacing" viewport="700x170" name="Radii & borders" subtitle="Soft but not pill-round — 7 to 18px" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px 22px;background:var(--paper);} .row{display:flex;gap:16px;align-items:flex-end;} .it{text-align:center;} .tile{width:84px;height:64px;background:var(--paper-2);border:2px solid var(--coral);} .tok{margin-top:7px;font:400 11.5px var(--font-mono);color:var(--text-faint);}</style>
</head>
<body>
  <div class="row">
    <div class="it"><div class="tile" style="border-radius:var(--radius-sm);"></div><div class="tok">sm · 7</div></div>
    <div class="it"><div class="tile" style="border-radius:var(--radius-md);"></div><div class="tok">md · 12</div></div>
    <div class="it"><div class="tile" style="border-radius:var(--radius-lg);"></div><div class="tok">lg · 14</div></div>
    <div class="it"><div class="tile" style="border-radius:var(--radius-xl);"></div><div class="tok">xl · 18</div></div>
    <div class="it"><div class="tile" style="width:120px;border-radius:var(--radius-pill);"></div><div class="tok">pill · 20</div></div>
  </div>
</body>
</html>

<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px 24px;background:var(--paper);color:var(--text-strong);}</style>
</head>
<body>
  <div style="font:600 16px var(--font-mono);color:var(--coral);letter-spacing:0.1em;text-transform:uppercase;">The big idea</div>
  <div style="margin-top:12px;display:flex;gap:10px;align-items:center;">
    <span style="font:600 14px var(--font-mono);background:var(--ink);color:var(--paper);padding:6px 12px;border-radius:7px;">reads all</span>
    <span style="font:600 14px var(--font-mono);color:var(--text-faint);">→</span>
    <span style="font:600 14px var(--font-mono);background:var(--coral);color:var(--ink);padding:6px 12px;border-radius:7px;">Q1</span>
    <span style="font:400 14px var(--font-mono);color:var(--text-muted);">· 200 tok</span>
  </div>
  <div style="margin-top:14px;font:400 12.5px var(--font-mono);color:var(--text-faint);">IBM Plex Mono · UPPERCASE eyebrow, tracking 0.1em · lowercase data labels</div>
</body>
</html>

<!-- @dsCard group="Spacing" viewport="700x180" name="Spacing scale" subtitle="Warm, generous rhythm — gap-driven" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px 24px;background:var(--paper);} .ln{display:flex;align-items:center;gap:14px;padding:5px 0;} .bar{height:14px;background:var(--coral);border-radius:3px;} .tok{font:400 12px var(--font-mono);color:var(--text-faint);}</style>
</head>
<body>
  <div class="ln"><div class="bar" style="width:var(--space-2);"></div><span class="tok">--space-2 · 9</span></div>
  <div class="ln"><div class="bar" style="width:var(--space-5);"></div><span class="tok">--space-5 · 24</span></div>
  <div class="ln"><div class="bar" style="width:var(--space-6);"></div><span class="tok">--space-6 · 32</span></div>
  <div class="ln"><div class="bar" style="width:var(--space-9);"></div><span class="tok">--space-9 · 56</span></div>
  <div class="ln"><div class="bar" style="width:var(--space-10);"></div><span class="tok">--space-10 · 84 · slide gutter</span></div>
</body>
</html>

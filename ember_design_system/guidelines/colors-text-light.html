<!-- @dsCard group="Colors" viewport="700x158" name="Text on paper" subtitle="Three-step text ramp for light surfaces" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px 22px;background:var(--paper);} .ln{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line-light-2);} .tok{font:400 12px var(--font-mono);color:var(--text-faint);}</style>
</head>
<body>
  <div class="ln"><span style="font:600 22px var(--font-display);color:var(--text-strong);letter-spacing:-0.02em;">Strong heading &amp; body</span><span class="tok">--text-strong</span></div>
  <div class="ln"><span style="font:400 17px var(--font-body);color:var(--text-muted);">Muted secondary copy</span><span class="tok">--text-muted</span></div>
  <div class="ln"><span style="font:400 14px var(--font-mono);color:var(--text-faint);">faint caption / label</span><span class="tok">--text-faint</span></div>
  <div class="ln" style="border-bottom:none;"><span style="font:600 17px var(--font-body);color:var(--coral-ink);">one coral word</span><span class="tok">--coral-ink</span></div>
</body>
</html>

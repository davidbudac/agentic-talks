<!-- @dsCard group="Colors" viewport="700x158" name="Semantic" subtitle="Positive / warning / danger — warm, never neon" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--paper);font-family:var(--font-mono);} .row{display:flex;gap:12px;} .sw{flex:1;min-width:0;} .blk{height:62px;border-radius:10px;border:1px solid rgba(0,0,0,.07);} .nm{margin-top:7px;font:600 12px var(--font-mono);color:var(--text-strong);} .hx{font:400 11px var(--font-mono);color:var(--text-faint);}</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="blk" style="background:var(--positive);"></div><div class="nm">positive</div><div class="hx">#3fb950</div></div>
    <div class="sw"><div class="blk" style="background:var(--positive-on-dark);"></div><div class="nm">positive↗dark</div><div class="hx">#7fdc8a</div></div>
    <div class="sw"><div class="blk" style="background:var(--positive-ink);"></div><div class="nm">positive-ink</div><div class="hx">#1f7a32</div></div>
    <div class="sw"><div class="blk" style="background:var(--warning);"></div><div class="nm">warning</div><div class="hx">#d9a441</div></div>
    <div class="sw"><div class="blk" style="background:var(--danger);"></div><div class="nm">danger</div><div class="hx">#b9361a</div></div>
    <div class="sw"><div class="blk" style="background:var(--danger-on-dark);"></div><div class="nm">danger↗dark</div><div class="hx">#e0795f</div></div>
  </div>
</body>
</html>

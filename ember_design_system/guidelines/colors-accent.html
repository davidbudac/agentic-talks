<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--paper);font-family:var(--font-mono);} .row{display:flex;gap:14px;} .sw{flex:1;min-width:0;} .blk{height:74px;border-radius:10px;border:1px solid rgba(0,0,0,.07);} .nm{margin-top:8px;font:600 13px var(--font-mono);color:var(--text-strong);} .hx{font:400 12px var(--font-mono);color:var(--text-faint);}</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="blk" style="background:var(--coral);"></div><div class="nm">coral</div><div class="hx">#ff5c35 · --coral</div></div>
    <div class="sw"><div class="blk" style="background:var(--coral-ink);"></div><div class="nm">coral-ink</div><div class="hx">#b9361a · text on light</div></div>
    <div class="sw"><div class="blk" style="background:var(--coral-tint);"></div><div class="nm">coral-tint</div><div class="hx">#ffe0d6</div></div>
    <div class="sw"><div class="blk" style="background:var(--coral-soft);"></div><div class="nm">coral-soft</div><div class="hx">#ffe9e2 · callout bg</div></div>
  </div>
</body>
</html>

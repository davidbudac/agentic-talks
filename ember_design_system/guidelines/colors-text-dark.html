<!-- @dsCard group="Colors" viewport="700x158" name="Text on ink" subtitle="Three-step text ramp for dark surfaces" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px 22px;background:var(--ink);} .ln{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line-dark);} .tok{font:400 12px var(--font-mono);color:var(--on-dark-faint);}</style>
</head>
<body>
  <div class="ln"><span style="font:600 22px var(--font-display);color:var(--on-dark);letter-spacing:-0.02em;">Strong heading &amp; body</span><span class="tok">--on-dark</span></div>
  <div class="ln"><span style="font:400 17px var(--font-body);color:var(--on-dark-muted);">Muted secondary copy</span><span class="tok">--on-dark-muted</span></div>
  <div class="ln"><span style="font:400 14px var(--font-mono);color:var(--on-dark-faint);">faint caption / label</span><span class="tok">--on-dark-faint</span></div>
  <div class="ln" style="border-bottom:none;"><span style="font:600 17px var(--font-body);color:var(--coral);">one coral word</span><span class="tok">--coral</span></div>
</body>
</html>

<!-- @startingPoint section="Slides" subtitle="Step-flow diagram slide" viewport="1280x720" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;display:flex;align-items:center;justify-content:center;background:#cdc3b0;font-family:var(--font-body);}</style>
</head>
<body>
<div style="width:1280px;height:720px;overflow:hidden;background:var(--paper);color:var(--text-strong);box-sizing:border-box;padding:64px 73px 56px;display:flex;flex-direction:column;">
  <div style="font:600 16px var(--font-mono);color:var(--coral);letter-spacing:0.1em;text-transform:uppercase;">The big idea</div>
  <h2 style="margin:9px 0 8px;font:700 43px var(--font-display);letter-spacing:-0.025em;">It's like handing a job to a helper</h2>
  <p style="margin:0 0 34px;font:400 21px var(--font-body);color:var(--text-muted);max-width:940px;text-wrap:pretty;">You stay on the main task. A helper digs on its own, and brings back just the answer.</p>
  <div style="flex:1;display:flex;align-items:stretch;gap:18px;">
    <div style="flex:1;background:var(--paper-2);border:1.5px solid var(--line-light);border-radius:16px;padding:22px;display:flex;flex-direction:column;">
      <div style="font:600 14px var(--font-mono);color:var(--text-faint);">① THE SETUP</div>
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;">
        <div style="background:var(--coral);color:var(--ink);border-radius:8px;padding:11px 30px;font:700 20px var(--font-display);">YOU</div>
        <div style="width:78%;height:8px;background:var(--bar);border-radius:3px;"></div>
      </div>
      <div style="font:400 18px var(--font-body);color:var(--text-muted);">You're focused on the main job.</div>
    </div>
    <span style="align-self:center;font:700 30px var(--font-display);color:var(--coral);">→</span>
    <div style="flex:1;background:var(--paper-2);border:1.5px solid var(--line-light);border-radius:16px;padding:22px;display:flex;flex-direction:column;">
      <div style="font:600 14px var(--font-mono);color:var(--text-faint);">② THE HAND-OFF</div>
      <div style="flex:1;display:flex;align-items:center;justify-content:center;">
        <div style="width:100%;border:2px dashed var(--line-light);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:7px;">
          <div style="height:8px;background:var(--bar);border-radius:3px;width:92%;"></div>
          <div style="height:8px;background:var(--bar);border-radius:3px;width:68%;"></div>
          <div style="height:8px;background:var(--bar);border-radius:3px;width:84%;"></div>
        </div>
      </div>
      <div style="font:400 18px var(--font-body);color:var(--text-muted);">A helper digs — in its own space.</div>
    </div>
    <span style="align-self:center;font:700 30px var(--font-display);color:var(--coral);">→</span>
    <div style="flex:1;background:var(--ink);border-radius:16px;padding:22px;display:flex;flex-direction:column;">
      <div style="font:600 14px var(--font-mono);color:var(--coral);">③ THE PAYOFF</div>
      <div style="flex:1;display:flex;align-items:center;justify-content:center;">
        <div style="background:var(--paper);color:var(--ink);border-radius:8px;padding:13px 22px;font:700 18px var(--font-display);display:flex;align-items:center;gap:9px;"><span style="color:var(--positive-ink);">✓</span> The answer</div>
      </div>
      <div style="font:400 18px var(--font-body);color:var(--on-dark-muted);">Just the answer comes back.</div>
    </div>
  </div>
</div>
</body>
</html>
